<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành nhúng CSS - Internal Style</title>
    <!-- Phần 2: Internal CSS - khai báo trong thẻ style ở head. -->
    <style>
        h1 {
            color: blue;
        }

        p {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Đây là tiêu đề</h1>
    <p>Đây là đoạn văn bản.</p>
</body>
</html>
