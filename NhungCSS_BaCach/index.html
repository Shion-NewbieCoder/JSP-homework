<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành nhúng CSS - Inline Style</title>
</head>
<body>
    <!-- Phần 1: Inline CSS - đặt quy tắc CSS trực tiếp trong thuộc tính style. -->
    <h1 style="color: blue;">Đây là tiêu đề</h1>
    <p style="color: red;">Đây là đoạn văn bản.</p>

    <!--
       Phần 2: Xem internal-style.html (CSS nằm trong thẻ <style> ở <head>).
       Phần 3: Xem external-style.html + style.css (CSS trong file riêng,
       nhúng bằng <link rel="stylesheet" href="style.css">).
       Cả ba cách đều cho kết quả: tiêu đề màu xanh, đoạn văn màu đỏ.
    -->
</body>
</html>
