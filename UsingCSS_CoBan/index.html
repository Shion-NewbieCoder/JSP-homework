<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS cơ bản</title>
    <style>
        /* Bước 2: Thay đổi màu, font chữ và kích thước chữ của h1, p. */
        h1 {
            color: blue;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }

        /* Bước 3: Tạo viền. Bước 4: Thêm khoảng đệm bên trong viền. */
        p {
            color: red;
            font-family: Arial, sans-serif;
            font-size: 120%;
            border: 1px solid grey;
            padding: 10px;
        }

        /* Bước 5: Chỉ ghi đè màu chữ cho phần tử có id="element1". */
        #element1 {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Đây là đề mục</h1>

    <p>Đây là đoạn văn bản.</p>
    <p>Đây là đoạn văn bản.</p>
    <p>Đây là đoạn văn bản.</p>
    <p id="element1">Đoạn văn bản có thuộc tính id</p>
</body>
</html>
